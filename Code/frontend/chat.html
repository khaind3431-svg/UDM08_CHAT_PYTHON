<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wireline — Trò chuyện</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/sidebar.css" />
<link rel="stylesheet" href="css/chat.css" />
</head>
<body>

<div class="app-shell">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="who">
        <span class="avatar status" style="width:40px;height:40px;font-size:14px">CP</span>
        <div class="identity">
          <div class="name" id="current-username">Bạn</div>
        </div>
        <button class="icon-btn" id="friend-requests-btn" aria-label="Lời mời kết bạn" style="position:relative">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span id="friend-requests-badge" class="req-badge" style="display:none">0</span>
        </button>
        <button class="theme-toggle" role="switch" aria-checked="false" aria-label="Chuyển giao diện sáng/tối">
          <span class="knob">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </span>
        </button>
      </div>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" placeholder="Tìm liên hệ hoặc cuộc trò chuyện" />
      </div>

      <div class="friend-add-wrap">
        <input type="text" id="friend-add-input" placeholder="Kết bạn theo tên đăng nhập..." />
        <button class="icon-btn" id="friend-add-btn" aria-label="Gửi lời mời kết bạn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        </button>
      </div>
      <div id="friend-add-status" class="friend-add-status"></div>
    </div>

    <div class="contact-list">
      <div class="list-label">Bạn bè (<span id="friends-count">0</span>)</div>

      <!-- Danh sach ban be duy nhat (gom ca dang online lan offline),
           moi nguoi tu hien cham trang thai ben canh ten trong chinh
           renderFriendsList() - khong con tach rieng khoi "dang hoat
           dong" hay phong chat chung nua. -->
      <div id="friends-list"></div>
    </div>

    <div class="sidebar-footer">
      <span class="label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.13.47.4.9 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Cài đặt
      </span>
      <span class="label" id="logout-btn" style="cursor:pointer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Đăng xuất
      </span>
    </div>
  </aside>

  <!-- ============ CHAT PANEL ============ -->
  <main class="chat-panel">
    <header class="chat-header">
      <span class="avatar status offline" style="width:42px;height:42px">?</span>
      <div class="identity">
        <div class="name">Chọn một người bạn để trò chuyện</div>
        <div class="status">&nbsp;</div>
      </div>
      <div class="spacer"></div>
      <div class="actions">
        <button class="icon-btn" aria-label="Thông tin cuộc trò chuyện">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        </button>
      </div>
    </header>

    <!-- Duoc chat-network.js render dong tu tin nhan that qua socket
         TCP, khong con la hoi thoai mau tinh nhu truoc. -->
    <div class="message-scroll" id="message-scroll"></div>

    <!-- ============ COMPOSER ============ -->
    <div class="composer-wrap">
      <div class="reply-banner" id="reply-banner" style="display:none">
        <div class="content">
          <div class="to-name" id="reply-banner-name">Đang trả lời</div>
          <div class="snippet" id="reply-banner-snippet"></div>
        </div>
        <button class="icon-btn close-btn" id="reply-cancel-btn" aria-label="Huỷ trả lời">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="composer">
        <input id="image-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden />
        <button class="icon-btn" id="image-btn" aria-label="Gửi ảnh" title="Gửi ảnh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        </button>
        <button class="icon-btn" data-action="toggle-emoji" aria-label="Chọn emoji">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg>
        </button>

        <div class="input-box">
          <input type="text" id="composer-input" placeholder="Nhập tin nhắn..." />
        </div>

        <button class="send-btn" id="send-btn" aria-label="Gửi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </div>

      <!-- Emoji picker (static demo grid) -->
      <div class="emoji-picker" style="display:none">
        <div class="tabs">
          <button class="active">🙂</button>
          <button>❤️</button>
          <button>👍</button>
          <button>🎉</button>
          <button>🔥</button>
        </div>
        <div class="grid">
          <button>😀</button><button>😁</button><button>😂</button><button>🤣</button><button>😊</button><button>😍</button><button>😘</button>
          <button>😎</button><button>🤔</button><button>😴</button><button>😭</button><button>😡</button><button>😱</button><button>🥳</button>
          <button>👍</button><button>👎</button><button>👏</button><button>🙏</button><button>💪</button><button>🤝</button><button>✌️</button>
          <button>❤️</button><button>🔥</button><button>🎉</button><button>✅</button><button>⭐</button><button>💡</button><button>📌</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ============ FORWARD MODAL (static mock) ============ -->
<div class="modal-backdrop" style="display:none">
  <div class="forward-modal">
    <h3>Chuyển tiếp tin nhắn</h3>
    <p class="sub">Chọn người nhận hoặc cuộc trò chuyện</p>

    <div class="quoted" id="forward-quoted"></div>

    <!-- Danh sách người có thể chuyển tiếp tới -->
    <div class="forward-list" id="forward-list">
      <div class="contact-item" data-target="hoai-nam">
        <span class="avatar status" style="width:46px;height:46px">HN</span>
        <div class="meta"><div class="row-top"><span class="name">Hoài Nam</span></div></div>
      </div>
      <div class="contact-item" data-target="thu-ha">
        <span class="avatar status" style="width:46px;height:46px">TH</span>
        <div class="meta"><div class="row-top"><span class="name">Thu Hà</span></div></div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-ghost" data-action="close-modal">Huỷ</button>
      <button class="btn-primary" id="forward-confirm-btn">Chuyển tiếp</button>
    </div>
  </div>
</div>

<!-- ============ PROFILE MODAL ============ -->
<div class="modal-backdrop" id="profile-modal-backdrop" style="display:none">
  <div class="forward-modal profile-modal">
    <button class="icon-btn close-btn" id="profile-modal-close" aria-label="Đóng" style="position:absolute;top:14px;right:14px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>

    <div class="profile-avatar" id="profile-avatar">?</div>
    <h3 id="profile-fullname">—</h3>
    <p class="sub" id="profile-username">@—</p>
    <div class="profile-status" id="profile-status"><span class="dot"></span>—</div>
    <p class="profile-bio" id="profile-bio"></p>

    <div class="modal-actions" id="profile-actions" style="justify-content:center"></div>
  </div>
</div>

<!-- ============ FRIEND REQUESTS MODAL ============ -->
<div class="modal-backdrop" id="friend-requests-modal-backdrop" style="display:none">
  <div class="forward-modal">
    <h3>Lời mời kết bạn</h3>
    <p class="sub">Những người muốn kết bạn với bạn</p>

    <div class="forward-list" id="friend-requests-list">
      <div class="empty-hint" id="friend-requests-empty">Không có lời mời nào.</div>
    </div>

    <div class="modal-actions">
      <button class="btn-ghost" id="friend-requests-close">Đóng</button>
    </div>
  </div>
</div>

<script src="js/theme-toggle.js"></script>
<script src="js/ui-interactions.js"></script>
<script src="js/network.js"></script>
<script src="js/chat-network.js"></script>
</body>
</html>
